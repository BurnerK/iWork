name: iwork-studio

services:
  studio:
    image: node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    command: [npm, exec, --yes, --package=@agentscope/studio@1.0.9, --, as_studio]
    init: true
    environment:
      PORT: "3000"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - studio-data:/root

volumes:
  studio-data:
