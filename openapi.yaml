openapi: 3.0.1
info:
  title: iWork API
  description: 写请求先调用 GET /api/auth/csrf，保留会话 Cookie，并在请求头传入返回的令牌。
  version: 0.1.0
servers:
- url: http://127.0.0.1:8080
  description: 本地开发
paths:
  /api/admin/model-settings:
    get:
      tags:
      - 模型与预算
      summary: GET /api/admin/model-settings
      operationId: get_api_admin_model_settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.model.ModelService.Settings"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    put:
      tags:
      - 模型与预算
      summary: 设置计价货币
      operationId: put_api_admin_model_settings
      requestBody:
        content:
          application/json:
            schema:
              required:
              - currency
              type: object
              properties:
                currency:
                  type: string
                  description: ISO 4217 货币代码
              additionalProperties: false
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.model.ModelService.Settings"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/admin/models:
    get:
      tags:
      - 模型与预算
      summary: GET /api/admin/models
      operationId: get_api_admin_models
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/io.iwork.model.ModelService.Model"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    post:
      tags:
      - 模型与预算
      summary: 新增模型
      operationId: post_api_admin_models
      requestBody:
        content:
          application/json:
            schema:
              required:
              - baseUrl
              - credentialRef
              - enabled
              - inputPrice
              - modelName
              - name
              - outputPrice
              type: object
              properties:
                baseUrl:
                  maxLength: 1000
                  type: string
                  format: uri
                contextWindow:
                  maximum: 131072
                  minimum: 8192
                  type: integer
                  nullable: true
                credentialRef:
                  pattern: "^IWORK_MODEL_KEY_[A-Z0-9_]{1,80}$"
                  type: string
                enabled:
                  type: boolean
                inputPrice:
                  type: string
                  description: 十进制金额字符串
                modelName:
                  maxLength: 200
                  type: string
                name:
                  maxLength: 100
                  type: string
                outputPrice:
                  type: string
                  description: 十进制金额字符串
              additionalProperties: false
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.model.ModelService.Model"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/admin/models/{id}:
    put:
      tags:
      - 模型与预算
      summary: 更新模型
      operationId: put_api_admin_models_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - baseUrl
              - credentialRef
              - enabled
              - inputPrice
              - modelName
              - name
              - outputPrice
              type: object
              properties:
                baseUrl:
                  maxLength: 1000
                  type: string
                  format: uri
                contextWindow:
                  maximum: 131072
                  minimum: 8192
                  type: integer
                  nullable: true
                credentialRef:
                  pattern: "^IWORK_MODEL_KEY_[A-Z0-9_]{1,80}$"
                  type: string
                enabled:
                  type: boolean
                inputPrice:
                  type: string
                  description: 十进制金额字符串
                modelName:
                  maxLength: 200
                  type: string
                name:
                  maxLength: 100
                  type: string
                outputPrice:
                  type: string
                  description: 十进制金额字符串
              additionalProperties: false
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.model.ModelService.Model"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/admin/tasks:
    get:
      tags:
      - 任务诊断
      summary: 查询近期任务诊断摘要
      operationId: get_api_admin_tasks
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hasMore:
                        type: boolean
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DiagnosticTask"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
  /api/admin/tasks/{id}/diagnostics:
    get:
      tags:
      - 任务诊断
      summary: 查看任意任务诊断
      operationId: get_api_admin_tasks_id_diagnostics
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TaskDiagnostics"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
  /api/admin/users:
    get:
      tags:
      - 用户管理
      summary: GET /api/admin/users
      operationId: get_api_admin_users
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.identity.IdentityService.UserPage"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    post:
      tags:
      - 用户管理
      summary: 创建用户
      operationId: post_api_admin_users
      requestBody:
        content:
          application/json:
            schema:
              required:
              - displayName
              - username
              type: object
              properties:
                displayName:
                  type: string
                username:
                  type: string
              additionalProperties: false
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.identity.IdentityService.IssuedPassword"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/admin/users/{id}/budget:
    get:
      tags:
      - 模型与预算
      summary: "GET /api/admin/users/{id}/budget"
      operationId: get_api_admin_users_id_budget
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.model.ModelService.Budget"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    put:
      tags:
      - 模型与预算
      summary: 设置用户预算
      operationId: put_api_admin_users_id_budget
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - limit
              type: object
              properties:
                limit:
                  type: string
                  description: 十进制金额字符串
              additionalProperties: false
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.model.ModelService.Budget"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/admin/users/{id}/model-access:
    get:
      tags:
      - 模型与预算
      summary: "GET /api/admin/users/{id}/model-access"
      operationId: get_api_admin_users_id_model_access
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    put:
      tags:
      - 模型与预算
      summary: 设置用户模型权限
      operationId: put_api_admin_users_id_model_access
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - modelIds
              type: object
              properties:
                modelIds:
                  maxItems: 100
                  uniqueItems: true
                  type: array
                  items:
                    type: string
              additionalProperties: false
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/admin/users/{id}/reset-password:
    post:
      tags:
      - 用户管理
      summary: "POST /api/admin/users/{id}/reset-password"
      operationId: post_api_admin_users_id_reset_password
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.identity.IdentityService.IssuedPassword"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/admin/users/{id}/status:
    patch:
      tags:
      - 用户管理
      summary: 更新用户状态
      operationId: patch_api_admin_users_id_status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - enabled
              type: object
              properties:
                enabled:
                  type: boolean
              additionalProperties: false
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.identity.IdentityService.User"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/agents:
    get:
      tags:
      - 个人智能体
      summary: GET /api/agents
      operationId: get_api_agents
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.agent.PersonalAgentService.Page"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    post:
      tags:
      - 个人智能体
      summary: 创建个人智能体
      operationId: post_api_agents
      requestBody:
        content:
          application/json:
            schema:
              required:
              - instructions
              - modelId
              - name
              type: object
              properties:
                instructions:
                  maxLength: 4000
                  type: string
                modelId:
                  type: string
                name:
                  maxLength: 120
                  type: string
              additionalProperties: false
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.agent.PersonalAgentService.Agent"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/agents/{id}:
    get:
      tags:
      - 个人智能体
      summary: "GET /api/agents/{id}"
      operationId: get_api_agents_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.agent.PersonalAgentService.Agent"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    put:
      tags:
      - 个人智能体
      summary: 更新个人智能体
      operationId: put_api_agents_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - instructions
              - modelId
              - name
              type: object
              properties:
                instructions:
                  maxLength: 4000
                  type: string
                modelId:
                  type: string
                name:
                  maxLength: 120
                  type: string
              additionalProperties: false
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.agent.PersonalAgentService.Agent"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/auth/csrf:
    get:
      tags:
      - 身份认证
      summary: 获取 CSRF 令牌
      operationId: get_api_auth_csrf
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    required:
                    - token
                    type: object
                    properties:
                      token:
                        type: string
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
  /api/auth/login:
    post:
      tags:
      - 身份认证
      summary: 登录
      operationId: post_api_auth_login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - password
              - username
              type: object
              properties:
                password:
                  type: string
                  format: password
                username:
                  type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.identity.Caller"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/auth/logout:
    post:
      tags:
      - 身份认证
      summary: 退出登录
      operationId: post_api_auth_logout
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/auth/me:
    get:
      tags:
      - 身份认证
      summary: GET /api/auth/me
      operationId: get_api_auth_me
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.identity.Caller"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
  /api/auth/password:
    post:
      tags:
      - 身份认证
      summary: POST /api/auth/password
      operationId: post_api_auth_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/io.iwork.identity.AuthController.PasswordChange"
        required: true
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
  /api/budget:
    get:
      tags:
      - 模型与预算
      summary: GET /api/budget
      operationId: get_api_budget
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.model.ModelService.Budget"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
  /api/conversations:
    get:
      tags:
      - 会话
      summary: GET /api/conversations
      operationId: get_api_conversations
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.conversation.ConversationService.Page"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - session: []
    post:
      tags:
      - 会话
      summary: 创建会话
      operationId: post_api_conversations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  nullable: true
                title:
                  maxLength: 200
                  type: string
                  default: 新会话
              additionalProperties: false
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                required:
                - data
                - error
                - success
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/io.iwork.conversation.ConversationService.Conversation"
                  error:
                    type: string
                    nullable: true
                  success:
                    type: boolean
                    enum:
                    - true
        default:
          $ref: "#/components/responses/ApiError"
      security:
