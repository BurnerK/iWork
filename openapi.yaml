  responses:
    ApiError:
      description: 请求失败。error 是供客户端处理的错误码。
      content:
        application/json:
          schema:
            required:
            - data
            - error
            - success
            type: object
            properties:
              data:
                type: object
                nullable: true
                enum:
                - null
              error:
                type: string
              success:
                type: boolean
                enum:
                - false
  securitySchemes:
    csrf:
      type: apiKey
      name: X-CSRF-TOKEN
      in: header
    session:
      type: apiKey
      name: IWORK_SESSION
      in: cookie
