      description: threadId 须与路径中的会话一致。runId 用作幂等标识。提交后可按任务 ID 另行订阅，断开流不会取消任务。
      operationId: post_api_conversations_id_ag_ui
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - forwardedProps
              - messages
              - runId
              - threadId
              type: object
              properties:
                context:
                  type: array
                  items:
                    type: object
                forwardedProps:
                  type: object
                  properties:
                    agentId:
                      type: string
                    baseVersionId:
                      type: string
                    materialIds:
                      maxItems: 5
                      type: array
                      items:
                        type: string
                    modelId:
                      type: string
                    outputMode:
                      type: string
                      enum:
                      - TEXT
                      - DOCUMENT
                      default: TEXT
                  additionalProperties: false
                messages:
                  maxItems: 1
                  minItems: 1
                  type: array
                  items:
                    required:
                    - content
                    - id
                    - role
                    type: object
                    properties:
                      content:
                        maxLength: 20000
                        type: string
                      id:
                        type: string
                      role:
                        type: string
                        enum:
                        - user
                runId:
                  maxLength: 100
                  type: string
                state:
                  type: object
                threadId:
                  type: string
                tools:
                  type: array
                  items:
                    type: object
        required: true
      responses:
        "200":
          description: AG-UI SSE。CUSTOM iwork.task 回执包含任务 ID、请求标识和业务状态，后续事件与按任务订阅一致。
          content:
            text/event-stream:
              schema:
                type: string
        "409":
          $ref: "#/components/responses/ApiError"
        default:
          $ref: "#/components/responses/ApiError"
      security:
      - csrf: []
        session: []
