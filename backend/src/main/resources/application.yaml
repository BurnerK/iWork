spring:
  application:
    name: iwork
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${IWORK_DB_HOST:localhost}:${IWORK_DB_PORT:3306}/${IWORK_DB_NAME:iwork}?connectTimeout=3000&socketTimeout=3000
    username: ${IWORK_DB_USER:iwork}
    password: ${IWORK_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 5
      data-source-properties:
        connectionTimeZone: "+00:00"
        forceConnectionTimeZoneToSession: true
  data:
    redis:
      host: ${IWORK_REDIS_HOST:localhost}
      port: ${IWORK_REDIS_PORT:6379}
      timeout: 3s
      connect-timeout: 3s
  session:
    timeout: 7d
    redis:
      namespace: iwork:session
  flyway:
    clean-disabled: true
    validate-on-migrate: true
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,fileStorage
iwork:
  cookie-secure: ${IWORK_COOKIE_SECURE:true}
  bootstrap:
    username: ${IWORK_BOOTSTRAP_USERNAME:admin}
    password: ${IWORK_BOOTSTRAP_PASSWORD:}
  files-directory: ${IWORK_FILES_DIRECTORY:./data/files}
logging:
  level:
    root: INFO
    org.springframework.boot.jdbc.health: ERROR
