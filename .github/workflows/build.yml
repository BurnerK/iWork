name: Build and smoke test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - name: Run Playwright E2E tests
        run: |
          playwright_version="$(node -p 'require("./frontend/node_modules/@playwright/test/package.json").version')"
          node_home="$(dirname "$(dirname "$(realpath "$(command -v node)")")")"
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" \
            --env CI=true --env HOME=/tmp \
            --env PATH=/opt/ci-node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$node_home,target=/opt/ci-node,readonly" \
            --workdir /workspace \
            "mcr.microsoft.com/playwright:v${playwright_version}-noble" \
            npm --prefix frontend run test:e2e
      - run: backend/mvnw -B -f backend/pom.xml spotless:check
      - run: python3 scripts/verify-backend.py
      - run: python3 scripts/verify-compose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
