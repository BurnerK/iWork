name: iwork
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${IWORK_HTTP_PORT:-8080}:8080"
    environment:
      IWORK_DB_HOST: mysql
      IWORK_REDIS_HOST: redis
      IWORK_BOOTSTRAP_USERNAME: ${IWORK_BOOTSTRAP_USERNAME:-admin}
      IWORK_BOOTSTRAP_PASSWORD: ${IWORK_BOOTSTRAP_PASSWORD:-}
      IWORK_COOKIE_SECURE: ${IWORK_COOKIE_SECURE:-true}
      IWORK_DB_PASSWORD: ${IWORK_DB_PASSWORD:?Set IWORK_DB_PASSWORD in .env}
      IWORK_FILES_DIRECTORY: /data/files
      IWORK_SANDBOX_URL: http://sandbox-manager:8090
      IWORK_SANDBOX_KEY_FILE: /run/secrets/sandbox_key
    volumes:
      - ${IWORK_DATA_DIR:-./data}/files:/data/files
    secrets: [sandbox_key]
    networks: [default, session, sandbox-control]
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  sandbox-manager:
    build:
      context: .
      target: sandbox-manager
    image: iwork-sandbox-manager:local
    environment:
      IWORK_SANDBOX_INSTANCE: ${IWORK_SANDBOX_INSTANCE:-iwork}
      IWORK_SANDBOX_IMAGE: iwork-text-parser:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-registry:/registry
      - sandbox-watchdog:/watchdog:ro
    secrets: [sandbox_key]
    depends_on:
      text-parser-image:
        condition: service_completed_successfully
    networks: [sandbox-control]
    read_only: true
    tmpfs: ["/tmp/codex:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      options: {max-size: 10m, max-file: '3'}
  sandbox-watchdog:
    image: iwork-sandbox-manager:local
    command: [watchdog]
    environment:
      IWORK_SANDBOX_INSTANCE: ${IWORK_SANDBOX_INSTANCE:-iwork}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-watchdog:/watchdog
    network_mode: none
    read_only: true
    tmpfs: ["/tmp/codex:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging:
      options: {max-size: 10m, max-file: '3'}
  text-parser-image:
    build:
      context: ./sandbox
      dockerfile: Dockerfile.worker
    image: iwork-text-parser:1
    entrypoint: [python, --version]
    network_mode: none

  mysql:
    image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
    environment:
      MYSQL_DATABASE: iwork
      MYSQL_USER: iwork
      MYSQL_PASSWORD: ${IWORK_DB_PASSWORD:?Set IWORK_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${IWORK_MYSQL_ROOT_PASSWORD:?Set IWORK_MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ${IWORK_DATA_DIR:-./data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u iwork -D iwork -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - redis-data:/data
    networks: [session]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
networks:
  sandbox-control:
    internal: true
  session:
    internal: true
secrets:
  sandbox_key:
    file: ${IWORK_SANDBOX_KEY_FILE:-./data/secrets/sandbox.key}
volumes:
  sandbox-registry:
  sandbox-watchdog:
  redis-data:
